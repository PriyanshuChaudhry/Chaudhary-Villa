<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="warmWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F5F3EF"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>

  <!-- Background Wall -->
  <rect width="800" height="500" fill="url(#warmWall)"/>

  <!-- Window with curtains -->
  <rect x="300" y="60" width="200" height="150" rx="8" fill="#E0F2FE" stroke="#CBD5E1" stroke-width="3"/>
  <line x1="400" y1="60" x2="400" y2="210" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="300" y1="135" x2="500" y2="135" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Drapes -->
  <path d="M285 50 Q295 130 280 220 L305 220 Q315 130 305 50 Z" fill="#0D9488" fill-opacity="0.8"/>
  <path d="M515 50 Q505 130 520 220 L495 220 Q485 130 495 50 Z" fill="#0D9488" fill-opacity="0.8"/>

  <!-- Bed Structure -->
  <rect x="220" y="240" width="360" height="60" rx="10" fill="url(#woodGrad)"/>
  <rect x="240" y="260" width="320" height="130" rx="10" fill="#E7E5E4" stroke="#D6D3D1" stroke-width="2"/>
  <!-- Pillows -->
  <rect x="260" y="270" width="110" height="45" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="430" y="270" width="110" height="45" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <!-- Blanket -->
  <rect x="240" y="315" width="320" height="75" rx="8" fill="#0F766E"/>

  <!-- Warm Wooden Floor -->
  <rect x="0" y="390" width="800" height="110" fill="#E7E5E4"/>
  <line x1="0" y1="390" x2="800" y2="390" stroke="#D6D3D1" stroke-width="2"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Study Desk on the Right -->
  <rect x="620" y="280" width="120" height="60" rx="6" fill="url(#woodGrad)"/>
  <line x1="630" y1="340" x2="630" y2="410" stroke="#78350F" stroke-width="4"/>
  <line x1="730" y1="340" x2="730" y2="410" stroke="#78350F" stroke-width="4"/>

  <!-- Label Badge -->
  <g transform="translate(400, 455)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0F766E">
      Middle Room • Quiet &amp; Private Living Space
    </text>
  </g>
</svg>
