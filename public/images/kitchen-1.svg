<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- Wall -->
  <rect width="800" height="500" fill="#FAF5FF"/>

  <!-- Kitchen Cabinets (Top) -->
  <rect x="200" y="60" width="400" height="90" rx="6" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="2"/>
  <line x1="333" y1="60" x2="333" y2="150" stroke="#D8B4FE" stroke-width="2"/>
  <line x1="466" y1="60" x2="466" y2="150" stroke="#D8B4FE" stroke-width="2"/>
  <!-- Handles -->
  <line x1="320" y1="130" x2="320" y2="140" stroke="#7E22CE" stroke-width="3"/>
  <line x1="450" y1="130" x2="450" y2="140" stroke="#7E22CE" stroke-width="3"/>
  <line x1="580" y1="130" x2="580" y2="140" stroke="#7E22CE" stroke-width="3"/>

  <!-- Backsplash tiles -->
  <rect x="200" y="160" width="400" height="90" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
  <line x1="200" y1="190" x2="600" y2="190" stroke="#F3E8FF" stroke-width="1"/>
  <line x1="200" y1="220" x2="600" y2="220" stroke="#F3E8FF" stroke-width="1"/>

  <!-- Countertop -->
  <rect x="180" y="250" width="440" height="20" rx="4" fill="#1E293B"/>

  <!-- Lower Cabinets -->
  <rect x="190" y="270" width="420" height="130" rx="6" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="2"/>
  <line x1="330" y1="270" x2="330" y2="400" stroke="#D8B4FE" stroke-width="2"/>
  <line x1="470" y1="270" x2="470" y2="400" stroke="#D8B4FE" stroke-width="2"/>

  <!-- Sink & Faucet -->
  <rect x="230" y="255" width="80" height="10" rx="2" fill="#94A3B8"/>
  <path d="M270 255 L270 235 Q270 225 260 225 L255 225" fill="none" stroke="#64748B" stroke-width="3"/>

  <!-- Stove / Burner -->
  <ellipse cx="510" cy="255" rx="20" ry="4" fill="#334155"/>
  <ellipse cx="560" cy="255" rx="20" ry="4" fill="#334155"/>

  <!-- Floor -->
  <rect x="0" y="400" width="800" height="100" fill="#F5F3FF"/>

  <!-- Label Badge -->
  <g transform="translate(400, 455)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0F766E">
      Kitchen • Shared Cooking &amp; Meal Space
    </text>
  </g>
</svg>
