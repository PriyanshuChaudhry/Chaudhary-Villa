<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="warmWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAFAF9"/>
      <stop offset="100%" stop-color="#F5F5F4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#warmWall)"/>

  <!-- Wall Picture Frame -->
  <rect x="330" y="80" width="140" height="100" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="3"/>
  <circle cx="400" cy="120" r="18" fill="#CCFBF1"/>
  <path d="M370 150 Q400 120 430 150 Z" fill="#14B8A6"/>

  <!-- Bed Backboard & Bed -->
  <rect x="250" y="240" width="300" height="150" rx="12" fill="#E7E5E4" stroke="#D6D3D1" stroke-width="2"/>
  <rect x="230" y="220" width="340" height="60" rx="10" fill="#292524"/>
  <!-- Pillows -->
  <rect x="280" y="250" width="100" height="40" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="420" y="250" width="100" height="40" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <!-- Bedspread -->
  <rect x="250" y="290" width="300" height="100" rx="6" fill="#0D9488" fill-opacity="0.85"/>

  <!-- Side Tables -->
  <rect x="170" y="270" width="50" height="70" rx="6" fill="#D6D3D1"/>
  <rect x="580" y="270" width="50" height="70" rx="6" fill="#D6D3D1"/>
  <!-- Lamp on left table -->
  <path d="M185 245 L205 245 L200 230 L190 230 Z" fill="#F59E0B"/>
  <line x1="195" y1="245" x2="195" y2="270" stroke="#78716C" stroke-width="2"/>

  <!-- Floor -->
  <rect x="0" y="390" width="800" height="110" fill="#F0FDFA"/>
  <line x1="0" y1="390" x2="800" y2="390" stroke="#CCFBF1" stroke-width="2"/>

  <!-- Label Badge -->
  <g transform="translate(400, 455)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0F766E">
      Front Balcony Room • Interior Layout
    </text>
  </g>
</svg>
