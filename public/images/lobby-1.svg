<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="warmWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F5F3EF"/>
    </linearGradient>
    <linearGradient id="sofaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>

  <!-- Background Wall -->
  <rect width="800" height="500" fill="url(#warmWall)"/>

  <!-- Warm Wooden Floor -->
  <rect x="0" y="380" width="800" height="120" fill="#E7E5E4"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#D6D3D1" stroke-width="2"/>
  <line x1="0" y1="430" x2="800" y2="430" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Wall Art / Mirror in Lobby -->
  <rect x="330" y="70" width="140" height="110" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <circle cx="400" cy="125" r="30" fill="#FDE68A" fill-opacity="0.6"/>

  <!-- Lobby Seating / Sofa -->
  <rect x="250" y="240" width="300" height="90" rx="16" fill="url(#sofaGrad)"/>
  <rect x="235" y="270" width="35" height="70" rx="10" fill="#134E4A"/>
  <rect x="530" y="270" width="35" height="70" rx="10" fill="#134E4A"/>
  <!-- Cushions -->
  <rect x="280" y="255" width="105" height="65" rx="10" fill="#14B8A6" fill-opacity="0.3"/>
  <rect x="415" y="255" width="105" height="65" rx="10" fill="#14B8A6" fill-opacity="0.3"/>

  <!-- Coffee Table in Front of Sofa -->
  <ellipse cx="400" cy="370" rx="90" ry="22" fill="url(#woodGrad)"/>
  <line x1="340" y1="370" x2="335" y2="405" stroke="#78350F" stroke-width="3"/>
  <line x1="460" y1="370" x2="465" y2="405" stroke="#78350F" stroke-width="3"/>

  <!-- Floor Lamp on Left -->
  <line x1="160" y1="120" x2="160" y2="395" stroke="#475569" stroke-width="3"/>
  <polygon points="135,160 185,160 175,120 145,120" fill="#FDE047" stroke="#EAB308"/>
  <ellipse cx="160" cy="395" rx="20" ry="6" fill="#475569"/>

  <!-- Indoor Plant on Right -->
  <path d="M640 340 L650 395 L680 395 L690 340 Z" fill="#D97706"/>
  <!-- Foliage -->
  <circle cx="665" cy="310" r="30" fill="#16A34A"/>
  <circle cx="645" cy="285" r="22" fill="#22C55E"/>
  <circle cx="685" cy="290" r="24" fill="#15803D"/>

  <!-- Label Badge -->
  <g transform="translate(400, 455)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0F766E">
      Lobby • Welcoming Common Reception Area
    </text>
  </g>
</svg>
